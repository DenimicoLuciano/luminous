# Render blueprint: one Docker web service on the free plan.
# App data lives in a Turso cloud database (TURSO_* env vars, set in the
# dashboard) so accounts survive redeploys. Without them the app falls
# back to a local file, which is ephemeral on the free plan.
# (Persistence verified Oct 29, 2026: accounts survive redeploys.)
services:
  - type: web
    name: luminous
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: TURSO_DATABASE_URL
        sync: false # set in the Render dashboard — free cloud DB for permanent accounts
      - key: TURSO_AUTH_TOKEN
        sync: false # set in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard — AI mentors/companions need this
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        sync: false # optional: point at another OpenAI-compatible endpoint (e.g. Gemini free tier)
      - key: TURN_URL
        sync: false # optional: WebRTC TURN relay (fixes live video on strict networks)
      - key: TURN_USERNAME
        sync: false # set together with TURN_URL and TURN_PASSWORD in the Render dashboard
      - key: TURN_PASSWORD
        sync: false
