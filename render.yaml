# Render blueprint: one Docker web service on the free plan.
# App data lives in a Turso cloud database (TURSO_* env vars, set in the
# dashboard) so accounts survive redeploys. Without them the app falls
# back to a local file, which is ephemeral on the free plan.
# (Persistence verified Oct 29, 2026: accounts survive redeploys.)
services:
  - type: web
    name: luminous
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: TURSO_DATABASE_URL
        sync: false # set in the Render dashboard — free cloud DB for permanent accounts
      - key: TURSO_AUTH_TOKEN
        sync: false # set in the Render dashboard
      - key: LUMIAI_API_KEY
        sync: false # set in the Render dashboard — the LumiAi lane key (free, from the lane console)
      - key: LUMIAI_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free # LumiAi lane default model (declared here so blueprint sync keeps it)
      - key: LUMIAI_BASE_URL
        value: https://lumiai.ai/api/v1 # the LumiAi lane address
      - key: ADSTERRA_KEY
        sync: false # optional: Adsterra banner unit key — turns on paid network ads in the feed
      - key: LUMICOIN_CORE_URL
        sync: false # optional: LumiCoin Core ledger URL — turns on unified LUMI balances for Lumiail-linked users (set together with LUMICOIN_PRODUCT_KEY)
      - key: LUMICOIN_PRODUCT_KEY
        sync: false # secret per-product key for LumiCoin Core; never commit the value
      - key: TURN_URL
        sync: false # optional: WebRTC TURN relay (fixes live video on strict networks)
      - key: TURN_USERNAME
        sync: false # set together with TURN_URL and TURN_PASSWORD in the Render dashboard
      - key: TURN_PASSWORD
        sync: false
