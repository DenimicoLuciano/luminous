# Render blueprint: one Docker web service on the free plan.
# Free services cannot attach persistent disks, so app data is ephemeral
# and resets on redeploy or restart. Move the plan to starter and re-add
# a disk block (mountPath /app/data) to make data permanent.
services:
  - type: web
    name: luminous
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard — AI mentors/companions need this
      - key: OPENAI_MODEL
        value: gpt-4o-mini
